<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Student Registration Form</title>
    <!--Bootstrap CSS-->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body>
   <div class="container mt-4">
    <h1 class="text-center text-primary">Student Registration Form</h1>
    <hr>
    <form>
        <!--Name Input-->
        <div class="mb-3">
            <label for="studentName" class="form-label">Student Name</label>
            <input type="text" class="form-control" id="studentName" placeholder="Enter your name">
        </div>
        <!--Email Input-->
        <div class="mb-3">
            <label for="studentEmail" class="form-label">Email address</label>
            <input type="email" class="form-control" id="studentEmail" aria-describedby="emailHelp" placeholder="Enter email">
        </div>
        <!--Password Input-->
        <div class="mb-3">
            <label for="studentPassword" class="form-label">Password</label>
            <input type="password" class="form-control" id="studentPassword" placeholder="Enter password">
        </div>
        <!--course Input-->
        <div class="mb-3">
            <label for="studentCourse" class="form-label">Course</label>
            <select class="form-select">
                <option selected>Select course</option>
                <option value="B.Tech">B.Tech</option>
                <option value="BSIT">BSIT</option>
                <option value="BSSE">BSSE</option>
            </select>
        </div>
        <!--Gender Input-->
        <div class="mb-3">
            <label for="studentGender" class="form-label">Gender</label>
            <select class="form-select" id="studentGender">
                <option selected>Select gender</option>
                <option value="male">Male</option>
                <option value="female">Female</option>
                <option value="other">Other</option>
            </select>
        </div>
        <!--Skills Input-->
        <div class="mb-3">
            <label for="studentSkills" class="form-label">Skills</label>
            <div class="form-check">
                <input class="form-check-input" type="checkbox" value="" id="skill1">
                <label class="form-check-label" for="skill1">
                    HTML
                </label>
            </div>
            <div class="form-check">
                <input class="form-check-input" type="checkbox" value="" id="skill2">
                <label class="form-check-label" for="skill2">
                    CSS
                </label>
            </div>
            <div class="form-check">
                <input class="form-check-input" type="checkbox" value="" id="skill3">
                <label class="form-check-label" for="skill3">
                    JavaScript
                </label>
            </div>
            <div class="form-check">
                <input class="form-check-input" type="checkbox" value="" id="skill4">
                <label class="form-check-label" for="skill4">
                    Python
                </label>
            </div>
        </div>  
        <!--Submit Button-->
        <button type="submit" class="btn btn-primary">Register</button>
        <button type="reset" class="btn btn-danger">Reset</button>
    </form>
</body>
</html>
