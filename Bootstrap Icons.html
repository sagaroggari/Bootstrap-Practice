<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Bootstrap Icons</title>
    <!--Bootstrap CSS-->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet">

    <!-- Bootstrap Icons CSS -->

    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.10.5/font/bootstrap-icons.css">
   
</head>
<body>
    <div class="container mt-5">
        <h2 class="text-center text-primary">Bootstrap Icons</h2>
        <button class="btn btn-primary mt-3">
            <i class="bi bi-house-door-fill"></i> Home
        </button>
        <button class="btn btn-success mt-3">
            <i class="bi bi-check-circle-fill"></i> Success
        </button>
        <button class="btn btn-danger mt-3">
            <i class="bi bi-exclamation-triangle-fill"></i> Warning
        </button>
        <button class="btn btn-info mt-3">
            <i class="bi bi-info-circle-fill"></i> Info
        </button>
        <button class="btn btn-warning mt-3">
            <i class="bi bi-exclamation-circle-fill"></i> Alert
        </button>
        <button class="btn btn-secondary mt-3">
            <i class="bi bi-gear-fill"></i> Settings
        </button>
        <button class="btn btn-dark mt-3">
            <i class="bi bi-moon-fill"></i> Dark Mode   
        </button>
        <button class="btn btn-light mt-3">
            <i class="bi bi-sun-fill"></i> Light Mode
        </button>
        <button class="btn btn-warning mt-3">
            <i class="bi bi-box-arrow-right"></i> Logout
        </button>
        <!--delete button-->
        <button class="btn btn-danger mt-3">
            <i class="bi bi-trash-fill"></i> Delete
        </button>
        <!--edit button-->  
        <button class="btn btn-primary mt-3">
            <i class="bi bi-pencil-fill"></i> Edit
        </button>
        <!--search button-->
        <button class="btn btn-info mt-3">      
        <i class="bi bi-search"></i> Search 
        </button>
        <!--download button-->
        <button class="btn btn-success mt-3">
            <i class="bi bi-download"></i> Download     
        </button>   

        <!-- Additional Icons -->
        <div class="mt-4">
            <h4 class="text-primary">Social Media Icons</h4>
            <i class="bi bi-facebook fs-2 me-3"></i>
            <i class="bi bi-twitter fs-2 me-3"></i>
            <i class="bi bi-instagram fs-2 me-3"></i>
            <i class="bi bi-linkedin fs-2 me-3"></i>
            <i class="bi bi-youtube fs-2 me-3"></i>
            <i class="bi bi-github fs-2 me-3"></i>
            <i class="bi bi-whatsapp fs-2 me-3"></i>
            <i class="bi bi-telegram fs-2 me-3"></i>
            <i class="bi bi-discord fs-2 me-3"></i>
            <i class="bi bi-reddit fs-2 me-3"></i>
            <i class="bi bi-tiktok fs-2 me-3"></i>
            <i class="bi bi-pinterest fs-2 me-3"></i>
            <!--Google Icons-->
            <h4 class="text-primary mt-4">Google Icons</h4>
            <i class="bi bi-google fs-2 me-3"></i>
            <i class="bi bi-google-play fs-2 me-3"></i>
            <i class="bi bi-google-drive fs-2 me-3"></i>
            <i class="bi bi-google-docs fs-2 me-3"></i>
            <i class="bi bi-google-sheets fs-2 me-3"></i>
            <i class="bi bi-google-slides fs-2 me-3"></i>
            <i class="bi bi-google-calendar fs-2 me-3"></i>
            <i class="bi bi-google-maps fs-2 me-3"></i>
            <!--Gmail Icons-->
            <h4 class="text-primary mt-4">Gmail Icons</h4>
            <i class="bi bi-gmail fs-2 me-3"></i>
            <i class="bi bi-envelope-fill fs-2 me-3"></i>
            <i class="bi bi-envelope fs-2 me-3"></i>
            <!--Phone call Icons-->
            <h4 class="text-primary mt-4">Phone Call Icons</h4>
            <i class="bi bi-telephone fs-2 me-3"></i>
            <i class="bi bi-telephone-fill fs-2 me-3"></i>
            <i class="bi bi-telephone-outbound fs-2 me-3"></i>
            <i class="bi bi-telephone-inbound fs-2 me-3"></i>
            <i class="bi bi-telephone-forward fs-2 me-3"></i>
            <i class="bi bi-telephone-back fs-2 me-3"></i>
            <!--Camera Icons-->
            <h4 class="text-primary mt-4">Camera Icons</h4>
            <i class="bi bi-camera fs-2 me-3"></i>
            <i class="bi bi-camera-fill fs-2 me-3"></i>
            <i class="bi bi-camera-video fs-2 me-3"></i>
            <i class="bi bi-camera-video-fill fs-2 me-3"></i>
            <!--Music Icons-->
            <h4 class="text-primary mt-4">Music Icons</h4>
            <i class="bi bi-music-note fs-2 me-3"></i>
            <i class="bi bi-music-note-beamed fs-2 me-3"></i>
            <i class="bi bi-music-note-list fs-2 me-3"></i>
            <!--Weather Icons-->
            <h4 class="text-primary mt-4">Weather Icons</h4>
            <i class="bi bi-sun fs-2 me-3"></i>
            <i class="bi bi-cloud fs-2 me-3"></i>
            <i class="bi bi-cloud-rain fs-2 me-3"></i>
            <i class="bi bi-cloud-lightning fs-2 me-3"></i>
            <i class="bi bi-cloud-snow fs-2 me-3"></i>
            <i class="bi bi-cloud-fog fs-2 me-3"></i>
            <i class="bi bi-cloud-hail fs-2 me-3"></i>

        </div>
    </div>
</body>
</html>
