<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Bootstrap Table Practice</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body>
    <div class="container">
        <h1 class="text-center">Student Details Table</h1>
        <hr>
        <table class="table table-striped table-bordered">
            <thead class="table-dark">
                <tr>
                    <th>Student ID</th>
                    <th>Name</th>
                    <th>Age</th>
                    <th>Grade</th>
                    <th>percentage</th>
                </tr>
            </thead>
            <tbody>
                <tr>
                    <td>1</td>
                    <td>John Doe</td>
                    <td>20</td>
                    <td>A</td>
                    <td>85%</td>
                </tr>
                <tr>
                    <td>2</td>
                    <td>Jane Smith</td>
                    <td>21</td>
                    <td>B+</td>
                    <td>78%</td>            
                </tr>
                <tr>
                    <td>3</td>
                    <td>Michael Johnson</td>
                    <td>19</td>
                    <td>A-</td>
                    <td>82%</td>                                
                </tr>
                <!-- Add more student rows as needed -->
                 <tr>
                    <td>4</td>
                    <td>Emily Davis</td>
                    <td>22</td>
                    <td>B</td>
                    <td>75%</td>
                </tr>
            </tbody>
        </table>
    </div>  
</body>
</html>
