<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Bootstrap Grid System with columns</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        .grid-box {
            border: 1px solid #fff;
            padding: 20px;
           
            margin-bottom: 10px;
            border-radius: 1px solid #fff;
        }

        .box1 {
            background-color: #007bff;
        }

        .box2 {
            background-color: #28a745;
        }

        .box3 {
            background-color: #17a2b8;
        }

        .box4 {
            background-color: #ffc107;
        }

        .box5 {
            background-color: #6c757d;
        }

        .box6 {
            background-color: #fd7e14;
        }

        .box7 {
            background-color: #6610f2;
        }

        .box8 {
            background-color: #e83e8c;
        }

        .box9 {
            background-color: #20c997;
        }

        .box10 {
            background-color: #fd7e14;
        }

        .box11 {
            background-color: #6f42c1;
        }
    </style>
</head>

<body>
    <div class="container-fluid bg-dark text-white p-4">
        <h1 class="text-center text-info">Bootstrap Grid System with 12 columns</h1>
        <!-- Row 1 four columns -->
        <div class="row">
            <div class="col-3 grid-box box1">.col 1</div>
            <div class="col-3 grid-box box2">.col 2</div>
            <div class="col-3 grid-box box3">.col 3</div>
            <div class="col-3 grid-box box4">.col 4</div>

        </div>
        <!-- Row 2 two columns -->
        <div class="row">
            <div class="col-6 grid-box box5">.col 5</div>
            <div class="col-6 grid-box box6">.col 6</div>
        </div>
        <!-- Row 3 one full-width column -->
        <div class="row">
            <div class="col-12 grid-box box7">.col 7</div>
        </div>
        <!-- Row 4 four columns -->
        <div class="row">
            <div class="col-3 grid-box box8">.col 8</div>
            <div class="col-3 grid-box box9">.col 9</div>
            <div class="col-3 grid-box box10">.col 10</div>
            <div class="col-3 grid-box box11">.col 11</div>
        </div>
    </div>
</body>

</html>
